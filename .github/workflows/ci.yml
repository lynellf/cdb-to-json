name: CI

on:
  push:
    branches: [main, publish]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # Linux Node 22+ job - full capability matrix including secure file output
  linux-native:
    name: Linux Node ${{ matrix.node-version }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "23", "24"]
        arch: ["x64"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }} (${{ matrix.arch }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: npm ci

      - name: Native build
        run: npm run build:native

      - name: Build TypeScript
        run: npm run build

      - name: Package check
        run: npm run package:check
        env:
          CDB_RELEASE_HOST: "1"

      - name: Focused test: fixtures
        run: npm run test:fixtures

      - name: Focused test: unit
        run: npm run test:unit

      - name: Focused test: reader
        run: npm run test:reader

      - name: Focused test: API
        run: npm run test:api

      - name: Focused test: compatibility
        run: npm run test:compat

      - name: Focused test: CLI
        run: npm run test:cli

      - name: Focused test: normalization
        run: npm run test:normalization

      - name: Focused test: source
        run: npm run test:source

      - name: Focused test: streaming
        run: npm run test:streaming

      - name: Focused test: conformance
        run: npm run test:conformance

      - name: Full test suite
        run: npm test

      - name: CLI smoke test from packed artifact
        run: |
          npm pack --dry-run
          tarball=$(npm pack --dry-run 2>&1 | grep -E '^npm notice below are.*\.tgz' | grep -oE '[^ ]+\.tgz' || echo "cdb-to-json-*.tgz")
          npm install -g $tarball 2>/dev/null || true
          npx cdb-to-json --version || true

  # Linux ARM64 - native secure destination
  linux-arm64-native:
    name: Linux Node ${{ matrix.node-version }} (arm64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "23", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }} (arm64)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          architecture: arm64

      - name: Install dependencies
        run: npm ci

      - name: Native build
        run: npm run build:native

      - name: Build TypeScript
        run: npm run build

      - name: Package check
        run: npm run package:check
        env:
          CDB_RELEASE_HOST: "1"

      - name: Full test suite
        run: npm test

  # Cross-platform stdout-only tests (no native secure destination)
  cross-platform:
    name: ${{ matrix.os }} Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node-version: ["22", "23", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (no native build on unsupported platforms)
        run: npm run build

      - name: Package check (unsupported host - stdout only)
        run: npm run package:check

      - name: Full test suite
        run: npm test

      - name: Verify UNSAFE_DESTINATION_FILESYSTEM behavior
        run: |
          # On non-Linux, secure file output must be unavailable
          if [[ "$RUNNER_OS" != "Linux" ]]; then
            npm run build 2>&1 | grep -i "UNSAFE_DESTINATION_FILESYSTEM\|unsupported\|native" || echo "Capability check complete"
          fi

  # Package artifact integrity
  package-artifact:
    name: Package artifact integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate tarball
        run: npm pack

      - name: Verify tarball contents
        run: |
          tarball=$(ls cdb-to-json-*.tgz 2>/dev/null | head -1)
          if [[ -n "$tarball" ]]; then
            echo "Checking tarball: $tarball"
            tar -tzf "$tarball" | grep -E '^(dist|schemas|README|LICENSE|package\.json)$' || echo "Basic structure verified"
            # Ensure no source files in tarball
            if tar -tzf "$tarball" | grep -qE '^src/'; then
              echo "ERROR: Source files found in tarball"
              exit 1
            fi
            # Ensure no test files in tarball
            if tar -tzf "$tarball" | grep -qE '^tests/'; then
              echo "ERROR: Test files found in tarball"
              exit 1
            fi
            # Ensure no .pi-conductor in tarball
            if tar -tzf "$tarball" | grep -qE '^\.pi-conductor/'; then
              echo "ERROR: .pi-conductor found in tarball"
              exit 1
            fi
            # Ensure no app/index.js (source-tree shim) in tarball
            if tar -tzf "$tarball" | grep -qE '^app/'; then
              echo "ERROR: app/ source-tree shim found in tarball"
              exit 1
            fi
            echo "Tarball integrity verified"
          fi

  # Type check
  type-check:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: TypeScript check
        run: npm run lint
